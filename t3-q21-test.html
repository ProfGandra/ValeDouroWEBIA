<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ValeDouroWEBIA — Teste isolado Q21</title>
<style>
html,body{height:100%;margin:0;background:#0d0b09;color:#eadfce;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{display:flex;flex-direction:column}.testbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;background:#241c14;border-bottom:1px solid #6b5337;font-size:13px}.testbar strong{color:#edc878}.testbar small{opacity:.78}.testbar button{border:1px solid #8d6d45;background:#332619;color:#eadfce;border-radius:8px;padding:7px 10px;cursor:pointer}.testbar button:hover{background:#443321}iframe{border:0;flex:1;width:100%;background:#0d0b09}.error{padding:24px;color:#ffb4a9;white-space:pre-wrap}
</style>
</head>
<body>
<div class="testbar"><div><strong>TESTE ISOLADO — T3 / Q21: Além dos Portões</strong><br><small>Usa o WEBIA atual. Nenhum botão narrativo foi adicionado. O índice normal Q1–Q20 não é alterado.</small></div><button id="exitTest" type="button">Restaurar progresso e sair</button></div>
<iframe id="webiaTest" title="ValeDouroWEBIA — Q21"></iframe>
<script>
(()=>{
'use strict';
const CAMPAIGN_KEY='valedouro.campaign.v1';
const BACKUP_KEY='valedouro.t3q21test.backup.v1';
const frame=document.getElementById('webiaTest');

function safeParse(raw,fallback){try{return JSON.parse(raw)}catch{return fallback}}
function restoreStaleBackup(){
  const b=localStorage.getItem(BACKUP_KEY);
  if(b!==null){localStorage.setItem(CAMPAIGN_KEY,b);localStorage.removeItem(BACKUP_KEY)}
}
function prepareTestCampaign(){
  restoreStaleBackup();
  const currentRaw=localStorage.getItem(CAMPAIGN_KEY);
  localStorage.setItem(BACKUP_KEY,currentRaw===null?'{}':currentRaw);
  const current=safeParse(currentRaw||'{}',{});
  const completed=Array.from({length:20},(_,i)=>`QST-${String(i+1).padStart(3,'0')}`);
  const test={...current,version:1,currentQuestId:'QST-021',completedQuestIds:[...new Set([...(current.completedQuestIds||[]),...completed])],season2Complete:true,updatedAt:new Date().toISOString()};
  localStorage.setItem(CAMPAIGN_KEY,JSON.stringify(test));
}
function restoreAndExit(){
  const b=localStorage.getItem(BACKUP_KEY);
  if(b!==null){
    if(b==='{}')localStorage.removeItem(CAMPAIGN_KEY);else localStorage.setItem(CAMPAIGN_KEY,b);
    localStorage.removeItem(BACKUP_KEY);
  }
  location.href='index.html';
}

document.getElementById('exitTest').addEventListener('click',restoreAndExit);
window.addEventListener('pagehide',()=>{
  const b=localStorage.getItem(BACKUP_KEY);
  if(b!==null){if(b==='{}')localStorage.removeItem(CAMPAIGN_KEY);else localStorage.setItem(CAMPAIGN_KEY,b);localStorage.removeItem(BACKUP_KEY)}
});

prepareTestCampaign();

const preloader=`<script>(function(){\n'use strict';\nconst nativeFetch=window.fetch.bind(window);\nwindow.__VALE_T3_Q21_TEST__=true;\nconst Q21_RULE='TESTE QST-021 — REGRA PRIORITÁRIA: a cena permanece no Liceu e em sua descida urbana imediata. Não invente bifurcações de trilhas, mata, floresta, aldeias, acampamentos, fumaça misteriosa, perigos ou destinos que não tenham sido escolhidos pelo jogador. Na primeira resposta, conecte brevemente com a noite anterior e com a pergunta de Tita \\'Vocês vão ficar?\\'. Tita é uma elfa adulta, figura consultiva do Liceu e ponte entre Conselho/Mestres e alunos; ela NÃO é aprendiz, cartógrafa ou professora, e não deve receber profissão inventada. Tita e Dornélius não precisam aparecer fisicamente. Se o jogador atravessar os portões, narre somente os portões, o primeiro trecho da descida e a visão geral de ValeDouro e da Baía. Não chegue ao Porto nessa resposta. Preserve o chat livre do WEBIA, sem opções A/B/C. Só use [[QUEST_COMPLETE]] quando os portões forem efetivamente atravessados.';\nfunction jsonResponse(data,res){const h=new Headers(res.headers);h.set('Content-Type','application/json; charset=utf-8');return new Response(JSON.stringify(data),{status:res.status,statusText:res.statusText,headers:h})}\nwindow.fetch=async function(input,init){\n const url=typeof input==='string'?input:(input&&input.url)||'';\n let nextInit=init;\n if(typeof AI_ENDPOINT!=='undefined'&&url===AI_ENDPOINT&&init&&init.method==='POST'&&init.body){\n  try{const b=JSON.parse(init.body);b.world={...(b.world||{}),q21_test_runtime_override:Q21_RULE};b.quest={...(b.quest||{}),q21_test_runtime_override:Q21_RULE};b.state={...(b.state||{}),q21Test:true,capabilityRules:[...((b.state&&b.state.capabilityRules)||[]),Q21_RULE]};nextInit={...init,body:JSON.stringify(b)}}catch(e){console.warn('Contexto prioritário Q21 não injetado',e)}\n }\n const res=await nativeFetch(input,nextInit);\n try{\n  if(/data\\/quests-index\\.json(?:\\?|$)/.test(url)){\n   const data=await res.clone().json();\n   if(Array.isArray(data)&&!data.some(x=>x.id==='QST-021'))data.push({id:'QST-021',title:'Além dos Portões',level:{min:1,ideal:4,max:20},type:['exploration','social','transition'],pillars:['exploration','interaction','combat_none'],duration:{minimum_sessions:1,maximum_sessions:1},test_only:true});\n   return jsonResponse(data,res);\n  }\n  if(/data\\/scene-visuals\\.json(?:\\?|$)/.test(url)){\n   const data=await res.clone().json();data.quests=data.quests||{};\n   data.quests['QST-021']=[{id:'SCN-001',src:'assets/quests/QST-020/qst020_cena05_manha_seguinte.png',label:'Além dos Portões — visual temporário de teste'}];\n   return jsonResponse(data,res);\n  }\n  if(typeof AI_ENDPOINT!=='undefined'&&url===AI_ENDPOINT){\n   const data=await res.clone().json();let changed=false;\n   for(const field of ['reply','text'])if(typeof data[field]==='string'){const clean=data[field].replace(/\\s*\\[\\[(?:SCN|LOC)-\\d{3}\\]\\]\\s*/gi,' ').replace(/\\s+/g,' ').trim();if(clean!==data[field]){data[field]=clean;changed=true}}\n   if(changed)return jsonResponse(data,res);\n  }\n }catch(e){console.warn('Patch de teste Q21 não aplicado',e)}\n return res;\n};\n})();<\/script>`;

fetch('index.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Não foi possível carregar index.html');return r.text()}).then(html=>{
  html=html.replace('<head>','<head>'+preloader);
  frame.srcdoc=html;
}).catch(err=>{frame.replaceWith(Object.assign(document.createElement('div'),{className:'error',textContent:'Falha ao preparar o teste Q21: '+err.message}))});
})();
</script>
</body>
</html>
