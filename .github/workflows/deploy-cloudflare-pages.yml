name: Deploy ValeDouro to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare deploy directory
        shell: bash
        run: |
          rm -rf _deploy
          mkdir -p _deploy

          # Arquivos principais da aplicação
          cp index.html _deploy/
          [ -f history.html ] && cp history.html _deploy/ || true
          [ -f terms.html ] && cp terms.html _deploy/ || true
          [ -f privacy.html ] && cp privacy.html _deploy/ || true
          [ -f VERSION.txt ] && cp VERSION.txt _deploy/ || true
          [ -f README.md ] && cp README.md _deploy/ || true

          # Diretórios necessários em runtime
          cp -R assets _deploy/
          cp -R compendio _deploy/
          cp -R data _deploy/
          cp -R css _deploy/
          cp -R js _deploy/

          # Arquivos estáticos opcionais na raiz
          find . -maxdepth 1 -type f \( -name '*.mp3' -o -name '*.ogg' -o -name '*.wav' -o -name '*.webp' -o -name '*.png' \) -exec cp {} _deploy/ \;

          echo 'Conteúdo preparado para deploy:'
          find _deploy -maxdepth 2 -type f | sort | head -200

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy _deploy --project-name=valedouro-webia --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
