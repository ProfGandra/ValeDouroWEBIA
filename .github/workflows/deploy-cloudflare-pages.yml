name: Deploy ValeDouro to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare deploy directory
        shell: bash
        run: |
          rm -rf _deploy
          mkdir -p _deploy
          cp index.html _deploy/
          [ -f VERSION.txt ] && cp VERSION.txt _deploy/ || true
          [ -f README.md ] && cp README.md _deploy/ || true
          cp -R assets _deploy/
          cp -R compendio _deploy/
          cp -R data _deploy/

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy _deploy --project-name=valedouro-webia --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
