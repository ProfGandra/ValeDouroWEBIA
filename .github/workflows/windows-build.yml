name: Build ValeDouro WEBIA Windows

on:
  push:
    branches:
      - windows-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows packages
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ValeDouro-WEBIA-Windows
          path: dist-windows/*
          if-no-files-found: error
          retention-days: 30
